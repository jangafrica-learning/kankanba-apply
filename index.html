<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kankanba Farm — Careers</title>
  <style>
    :root {
      --green: #2E7D32;
      --dark-green: #1B5E20;
      --light-green: #E8F5E9;
      --grey: #555555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #eef6ee 0%, #f7faf7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #2a2a2a;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      text-align: center;
    }
    .card-header {
      background: var(--dark-green);
      color: #fff;
      padding: 26px 20px 22px 20px;
    }
    .card-header h1 {
      margin: 10px 0 2px 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .card-header p {
      margin: 0;
      font-size: 13px;
      font-style: italic;
      color: var(--light-green);
    }
    .card-body {
      padding: 28px 26px 32px 26px;
    }
    .card-body h2 {
      color: var(--dark-green);
      font-size: 19px;
      margin: 0 0 10px 0;
    }
    .card-body p {
      color: var(--grey);
      font-size: 14.5px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .apply-btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 38px;
      border-radius: 30px;
      transition: background 0.15s;
    }
    .apply-btn:hover { background: var(--dark-green); }
    footer {
      font-size: 12px;
      color: var(--grey);
      padding: 16px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>KANKANBA FARM</h1>
      <p>Sanyang, The Gambia</p>
    </div>
    <div class="card-body">
      <h2>We're Hiring!</h2>
      <p>
        Kankanba Farm is looking for a Farm Manager and Agro-Technicians
        (Plant &amp; Animal Domain). Click below
        to fill in a simple application form.
      </p>
      <a class="apply-btn" href="Form.html">Click here to apply</a>
    </div>
    <footer>
      For help applying, call 2630798 / 5944287
    </footer>
  </div>
</body>
</html>
